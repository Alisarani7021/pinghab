# ساخت خودکار فایل APK روی گیت‌هاب — رایگان و بدون نصب Android Studio
# ۱) این پروژه را در گیت‌هاب آپلود کن  ۲) به تب Actions برو  ۳) روی Build APK کلیک کن
# ۴) فایل APK از بخش Artifacts دانلود می‌شود (debug، قابل نصب روی گوشی).
name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
        working-directory: android-apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dnsradar-apk
          path: android-apk/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
