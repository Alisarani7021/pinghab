# ساخت خودکار فایل APK روی گیت‌هاب — رایگان و بدون نصب Android Studio
# ۱) این پروژه را در گیت‌هاب آپلود کن  ۲) به تب Actions برو  ۳) روی Build APK کلیک کن
# ۴) فایل APK از بخش Artifacts دانلود می‌شود (debug، قابل نصب روی گوشی).
name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write   # برای انتشار فایل APK در بخش Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmdline-tools;latest'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
        working-directory: android-apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: dnsradar-apk
          path: android-apk/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # فایل APK را در Releases هم می‌گذاریم تا لینک دانلود ثابت و قابل‌نصب داشته باشی.
      # لینک همیشه: https://github.com/<user>/<repo>/releases/download/apk-latest/pinghab-latest.apk
      - name: Rename APK
        run: |
          mkdir -p out
          cp android-apk/app/build/outputs/apk/debug/*.apk out/pinghab-latest.apk
          ls -la out/

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "آخرین نسخهٔ APK (خودکار)"
          body: |
            این نسخه به‌طور خودکار از آخرین کد شاخهٔ main ساخته می‌شود.
            شامل تست DNS زنده، لیست DNS جهانی (۱۹۳ کشور)، سنجش اثر PoP و سنجش DoH از خود گوشی.
          files: out/pinghab-latest.apk
          make_latest: true
